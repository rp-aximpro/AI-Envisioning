services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_envision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_envision"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8025/api/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      API_PORT: 4000
      APP_BASE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_envision
      SESSION_SECRET: change-me-in-development
      OTP_SECRET: change-me-in-development
      TRACKING_SESSION_TTL_MINUTES: 480
      SENDGRID_API_KEY: ""
      EMAIL_FROM: "AI Envisioning Workshops <no-reply@example.local>"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: ai-envision-workshop-files
      S3_FORCE_PATH_STYLE: "true"
      PROGRAM_CURRENCY: EUR
      ADMIN_LOGIN_MAX_ATTEMPTS: 5
      ADMIN_LOGIN_WINDOW_MINUTES: 15
      ADMIN_SESSION_IDLE_TTL_MINUTES: 30
      ADMIN_SESSION_ABSOLUTE_TTL_HOURS: 12
      LOG_LEVEL: info
      MAX_UPLOAD_BYTES: 10485760
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    command: npm run dev:worker
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_envision
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: ai-envision-workshop-files
      S3_FORCE_PATH_STYLE: "true"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ai-envision-worker-ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
    environment:
      WEB_PORT: 5173
      VITE_API_BASE_URL: http://localhost:4000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
